services:
  database:
    container_name: vireon-database
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  database-e2e:
    image: postgres:17
    profiles:
      - e2e
    environment:
      POSTGRES_USER: vireon_e2e
      POSTGRES_PASSWORD: vireon_e2e
      POSTGRES_DB: vireon_e2e
    ports:
      - '5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vireon_e2e -d vireon_e2e']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

volumes:
  postgres_data:
