<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Vireon repository structure</title>
  <desc id="desc">The Vireon monorepo contains project media, the NestJS API, shared packages, public documentation, and the Turborepo task graph.</desc>

  <rect width="1200" height="620" fill="#F8FAFC"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="52" y="58" fill="#0F172A" font-size="30" font-weight="700">Repository map</text>
    <text x="52" y="88" fill="#64748B" font-size="16">Bun and Turborepo monorepo · current repository structure</text>

    <rect x="52" y="124" width="290" height="64" rx="12" fill="#0F172A"/>
    <text x="78" y="163" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">Vireon-Condominium/</text>

    <path d="M197 188V538" stroke="#94A3B8" stroke-width="2"/>
    <path d="M197 238H382M197 318H382M197 398H382M197 478H382M197 538H382" stroke="#94A3B8" stroke-width="2"/>

    <rect x="382" y="207" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="382" y="287" width="270" height="62" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <rect x="382" y="367" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="382" y="447" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="382" y="517" width="270" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <text x="404" y="235" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">assets/</text>
    <text x="404" y="255" fill="#64748B" font-size="12">Public documentation media</text>
    <text x="404" y="315" fill="#115E59" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">src/apps/api/</text>
    <text x="404" y="335" fill="#0F766E" font-size="12">NestJS application</text>
    <text x="404" y="395" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">packages/</text>
    <text x="404" y="415" fill="#64748B" font-size="12">Shared lint, TypeScript and UI packages</text>
    <text x="404" y="475" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">docs/</text>
    <text x="404" y="495" fill="#64748B" font-size="12">Architecture and domain documentation</text>
    <text x="404" y="543" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">turbo.json</text>

    <path d="M652 318H710" stroke="#0F766E" stroke-width="2"/>
    <path d="M710 238V489" stroke="#0F766E" stroke-width="2"/>
    <path d="M710 238H758M710 318H758M710 398H758M710 478H758" stroke="#0F766E" stroke-width="2"/>

    <rect x="758" y="207" width="378" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="758" y="287" width="378" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="758" y="367" width="378" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="758" y="447" width="378" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <text x="780" y="235" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">infrastructure/</text>
    <text x="780" y="255" fill="#64748B" font-size="12">Prisma schema, migrations, seed and Compose</text>
    <text x="780" y="315" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">src/modules/identity/</text>
    <text x="780" y="335" fill="#64748B" font-size="12">User identity and persistence</text>
    <text x="780" y="395" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">src/modules/auth/</text>
    <text x="780" y="415" fill="#64748B" font-size="12">Login, JWT and role guards</text>
    <text x="780" y="475" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">src/modules/resident/</text>
    <text x="780" y="495" fill="#64748B" font-size="12">Resident bounded context</text>

    <rect x="52" y="579" width="1084" height="1" fill="#CBD5E1"/>
    <text x="52" y="602" fill="#64748B" font-size="12">The API is the current application workspace; broader product capabilities remain planned.</text>
  </g>
</svg>
