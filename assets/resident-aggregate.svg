<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Resident aggregate</title>
  <desc id="desc">The Resident aggregate root owns up to ten contacts and one required profile-photo metadata entity. Resident uses UUID and person-name value objects, Contact uses UUID, email, and phone value objects, and ProfilePhoto uses UUID.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <marker id="diamond" viewBox="0 0 14 10" refX="2" refY="5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M0 5L5 0L10 5L5 10Z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#F8FAFC"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="52" y="58" fill="#0F172A" font-size="30" font-weight="700">Resident aggregate</text>
    <text x="52" y="88" fill="#64748B" font-size="16">Current domain model · v0.2.0</text>

    <rect x="42" y="116" width="1116" height="500" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="68" y="151" fill="#0F766E" font-size="13" font-weight="700" letter-spacing="1.6">CONSISTENCY BOUNDARY</text>

    <rect x="84" y="206" width="260" height="228" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <rect x="84" y="206" width="260" height="48" rx="12" fill="#0F172A"/>
    <path d="M84 242H344" stroke="#0F172A" stroke-width="24"/>
    <text x="106" y="237" fill="#FFFFFF" font-size="20" font-weight="700">Resident</text>
    <text x="106" y="283" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">id: Uuid</text>
    <text x="106" y="309" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">name: PersonName</text>
    <text x="106" y="335" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">contacts: Contact[]</text>
    <text x="106" y="361" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">profilePhoto: ProfilePhoto</text>
    <rect x="106" y="384" width="214" height="30" rx="6" fill="#CCFBF1"/>
    <text x="213" y="404" fill="#115E59" font-size="12" font-weight="700" text-anchor="middle">Resident.id = User.id · temporary</text>

    <rect x="430" y="184" width="320" height="184" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="430" y="184" width="320" height="44" rx="12" fill="#CCFBF1"/>
    <path d="M430 216H750" stroke="#CCFBF1" stroke-width="24"/>
    <text x="452" y="213" fill="#115E59" font-size="18" font-weight="700">Contact</text>
    <text x="452" y="258" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">id · type · value · isPrimary</text>
    <text x="452" y="287" fill="#475569" font-size="14">Type is fixed after creation.</text>
    <rect x="452" y="310" width="82" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
    <rect x="544" y="310" width="82" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="493" y="330" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">EMAIL</text>
    <text x="585" y="330" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">PHONE</text>
    <text x="727" y="330" fill="#64748B" font-size="13" text-anchor="end">0..10 owned</text>

    <rect x="430" y="398" width="320" height="170" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="430" y="398" width="320" height="44" rx="12" fill="#CCFBF1"/>
    <path d="M430 430H750" stroke="#CCFBF1" stroke-width="24"/>
    <text x="452" y="427" fill="#115E59" font-size="18" font-weight="700">ProfilePhoto</text>
    <text x="727" y="427" fill="#0F766E" font-size="12" font-weight="700" text-anchor="end">1 required by domain</text>
    <text x="452" y="468" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">id · storageKey</text>
    <text x="452" y="492" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">contentType · size</text>
    <text x="452" y="520" fill="#475569" font-size="14">PNG or JPEG · maximum 5 MiB</text>
    <text x="452" y="545" fill="#475569" font-size="13">Metadata only; no binary storage flow.</text>

    <path d="M344 286H430" stroke="#0F766E" stroke-width="2" marker-start="url(#diamond)"/>
    <path d="M376 286V483H429" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="376" y="270" fill="#64748B" font-size="12" text-anchor="middle">owns</text>

    <rect x="830" y="184" width="278" height="184" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="854" y="216" fill="#0F172A" font-size="16" font-weight="700">Value objects</text>
    <path d="M854 233H1084M854 277H1084M854 321H1084" stroke="#CBD5E1"/>
    <text x="854" y="260" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Uuid</text>
    <text x="1084" y="260" fill="#475569" font-size="13" text-anchor="end">Resident · Contact · ProfilePhoto</text>
    <text x="854" y="304" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">PersonName</text>
    <text x="1084" y="304" fill="#475569" font-size="13" text-anchor="end">Resident.name</text>
    <text x="854" y="348" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Email · Phone</text>
    <text x="1084" y="348" fill="#475569" font-size="13" text-anchor="end">Contact.value</text>

    <rect x="830" y="398" width="278" height="170" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="854" y="430" fill="#0F172A" font-size="16" font-weight="700">Aggregate operations</text>
    <text x="854" y="461" fill="#475569" font-size="13">change name · add contact</text>
    <text x="854" y="487" fill="#475569" font-size="13">change value · set primary</text>
    <text x="854" y="513" fill="#475569" font-size="13">remove contact · replace photo metadata</text>
    <path d="M854 536H1084" stroke="#CBD5E1"/>
    <text x="854" y="556" fill="#64748B" font-size="12">Children change through Resident.</text>

    <text x="68" y="646" fill="#64748B" font-size="13">Solid connectors show aggregate ownership. Value-object usage is listed by domain type.</text>
  </g>
</svg>
